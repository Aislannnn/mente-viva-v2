name: Test and deploy Flutter web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - run: flutter pub get
      - run: flutter test
      - run: flutter test test/widget_test.dart --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=demo-key
      - run: flutter analyze
      # Each deployment gets a new asset URL. Browsers that cached an earlier
      # Flutter bundle can then load the current games without clearing data.
      - name: Build versioned web release
        shell: bash
        run: |
          set -euo pipefail
          release="${GITHUB_SHA:0:12}"
          base="/${{ github.event.repository.name }}/releases/${release}/"
          flutter build web --release --base-href "$base" \
            --dart-define=ENABLE_SUPABASE_AUTH=true \
            --dart-define=SUPABASE_URL=https://hdgxxdaedzidkpfmsvra.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_iFYjAoi7kqylDEuNg_vMtw_T-tNdy-I
          mkdir -p "build/site/releases/$release"
          cp -a build/web/. "build/site/releases/$release/"
          cat > build/site/index.html <<EOF
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Mente Viva</title>
              <noscript><meta http-equiv="refresh" content="0;url=./releases/$release/"></noscript>
            </head>
            <body>
              <p>Carregando a versão atual do Mente Viva…</p>
              <p><a href="./releases/$release/">Abrir o aplicativo</a></p>
              <script>location.replace('./releases/$release/' + location.search + location.hash);</script>
            </body>
          </html>
          EOF
          touch build/site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
